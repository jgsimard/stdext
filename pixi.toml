[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "stdext"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "stdext"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[tasks]
test = "python stdext/_test_cli.py"
test_cli = "python -m unittest discover -s test/cli -p 'test_*.py'"
test_install = "python test/install.py"
fmt = "mojo format stdext test examples"

[dependencies]
mojo = ">=1.3.0.dev2026103105,<2"
python = ">=3.11,<4"
