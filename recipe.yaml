context:
  version: "0.1.0"

package:
  name: stdext
  version: ${{ version }}

source:
  path: stdext
  target_directory: stdext

build:
  script:
    - mkdir -p "$PREFIX/lib/mojo/stdext" "$PREFIX/bin"
    - cp stdext/*.mojo stdext/*.py "$PREFIX/lib/mojo/stdext/"
    - |
      cat > "$PREFIX/bin/stdext-test" <<'EOF'
      #!/usr/bin/env bash
      exec "$(dirname "$0")/python" "$(dirname "$0")/../lib/mojo/stdext/_test_cli.py" "$@"
      EOF
      chmod +x "$PREFIX/bin/stdext-test"

requirements:
  run:
    - mojo >=1.3.0.dev2026103105,<2
    - python >=3.11,<4

about:
  summary: Small Mojo utilities and a reusable test runner
